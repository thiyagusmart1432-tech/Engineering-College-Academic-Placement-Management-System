<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thangavelu Engineering College – Academic & Placement Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F4EF;--surface:#FFFFFF;--ink:#16213E;--muted:#5C6479;--line:#E2DFD6;--brand:#16213E;--brand-ink:#FFFFFF;--accent:#F2A900;--ok:#0E7C66;--bad:#C0392B;--chip:#EDEAE0;
--display:'Bricolage Grotesque','Trebuchet MS',sans-serif;--body:'Source Sans 3','Segoe UI',sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1424;--surface:#18203A;--ink:#EEF0F7;--muted:#9AA3BD;--line:#2A3454;--brand:#F2A900;--brand-ink:#16213E;--accent:#F2A900;--ok:#3DCCA8;--bad:#FF7B6B;--chip:#222C4B}}
:root[data-theme="dark"]{--bg:#0F1424;--surface:#18203A;--ink:#EEF0F7;--muted:#9AA3BD;--line:#2A3454;--brand:#F2A900;--brand-ink:#16213E;--accent:#F2A900;--ok:#3DCCA8;--bad:#FF7B6B;--chip:#222C4B}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body)}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--brand);color:var(--brand-ink);padding:24px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:20px}
.logo{font:800 22px var(--display);letter-spacing:-.5px;display:flex;align-items:center;gap:10px}
.logo i{width:32px;height:32px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:#16213E;font-style:normal;font-size:18px}
nav{display:flex;flex-direction:column;gap:4px}
nav button{background:none;border:0;color:inherit;text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer;opacity:.78;display:flex;gap:10px;align-items:center}
nav button:hover{opacity:1;background:rgba(127,127,127,.18)}
nav button[aria-current="true"]{opacity:1;background:var(--accent);color:#16213E;font-weight:600}
.role{margin-top:auto;font-size:14px}
.role label{display:block;opacity:.75;margin-bottom:6px}
.role select{width:100%;padding:9px;border-radius:10px;border:1px solid rgba(127,127,127,.5);background:transparent;color:inherit}
.role option{color:#16213E}
main{padding:28px clamp(16px,4vw,44px) 60px;max-width:1100px;width:100%}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.top h1{font-size:clamp(28px,4vw,40px);letter-spacing:-1px}
.top p{margin:6px 0 0;color:var(--muted)}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.card h3{font-size:18px;margin-bottom:12px}
.stat{display:flex;align-items:center;gap:16px}
.ring{--p:80;width:76px;height:76px;border-radius:50%;background:conic-gradient(var(--c,var(--ok)) calc(var(--p)*1%),var(--chip) 0);display:grid;place-items:center;flex:none}
.ring b{width:58px;height:58px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font:700 16px var(--display)}
.stat small{color:var(--muted);display:block}.stat strong{font:700 26px var(--display)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:14px}
.table-wrap{overflow-x:auto}
.bar{height:10px;border-radius:6px;background:var(--chip);overflow:hidden;min-width:90px}
.bar span{display:block;height:100%;border-radius:6px;background:var(--ok)}
.bar.low span{background:var(--bad)}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--chip);font-size:13px;font-weight:600}
.chip.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.chip.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.btn{background:var(--brand);color:var(--brand-ink);border:0;padding:9px 16px;border-radius:10px;font-weight:600;cursor:pointer}
.btn.alt{background:var(--chip);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:14px;color:var(--muted)}
.field input,.field select,.field textarea{padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.drive{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--line)}
.drive:last-child{border:0}.drive h4{margin:0;font:700 17px var(--display)}.drive p{margin:2px 0 6px;color:var(--muted);font-size:15px}
.toggle{width:42px;height:24px;border-radius:99px;border:0;background:var(--chip);position:relative;cursor:pointer;transition:background .15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:.15s}
.toggle[aria-pressed="true"]{background:var(--ok)}.toggle[aria-pressed="true"]::after{left:21px;background:#fff}
.resume{background:#fff;color:#16213E;border-radius:12px;padding:28px;border:1px solid var(--line);min-height:420px;font-size:15px}
.resume h2{font-size:26px;letter-spacing:-.5px}.resume h4{margin:16px 0 4px;font:700 14px var(--display);border-bottom:2px solid #F2A900;padding-bottom:3px}
.resume .sub{color:#5C6479;margin:2px 0 0}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--brand);color:var(--brand-ink);padding:10px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.on{opacity:1}
.empty{color:var(--muted);padding:12px 0}
@media (max-width:820px){
.app{grid-template-columns:1fr}
aside{position:sticky;top:0;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;z-index:10;gap:8px}
.logo span{display:none}.role{margin:0 0 0 auto;width:150px}.role label{display:none}
nav{flex-direction:row;overflow-x:auto;width:100%;order:3}nav button{white-space:nowrap;padding:8px 12px}
}
@property --p{syntax:'<number>';inherits:false;initial-value:0}
body{background:radial-gradient(circle at 92% -8%,color-mix(in srgb,var(--accent) 24%,transparent),transparent 42%),radial-gradient(circle at 0 100%,color-mix(in srgb,var(--ok) 16%,transparent),transparent 42%),var(--bg);background-attachment:fixed}
.logo span{display:flex;flex-direction:column;font-size:15px;line-height:1.15}.logo small{font:400 12px var(--body);opacity:.75;margin-top:2px}
.logo i{animation:float 4s ease-in-out infinite;box-shadow:0 0 0 0 var(--accent)}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:30px clamp(18px,4vw,38px);margin-bottom:24px;color:#fff;background:linear-gradient(120deg,#16213E,#2B3F8C,#0E7C66,#16213E);background-size:300% 300%;animation:flow 14s ease infinite,rise .6s ease both}
.hero h2{font-size:clamp(24px,3.6vw,36px);letter-spacing:-.8px;position:relative}.hero p{max-width:56ch;opacity:.92;margin:8px 0 18px;position:relative}.hero .btn{background:var(--accent);color:#16213E;position:relative}
.orb{position:absolute;right:-50px;top:-50px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,var(--accent),transparent 70%);opacity:.75;animation:float 6s ease-in-out infinite}
.ticker{overflow:hidden;border-radius:14px;background:var(--brand);color:var(--brand-ink);margin-bottom:20px;padding:11px 0}
.track{display:flex;width:max-content;animation:scroll 32s linear infinite}.ticker:hover .track{animation-play-state:paused}
.track span{font:700 15px var(--display);white-space:nowrap;padding-right:38px}.track span::before{content:"★ ";color:var(--accent)}
.card{transition:transform .25s,box-shadow .25s,border-color .25s}.card:hover{transform:translateY(-4px);box-shadow:0 16px 32px -14px rgba(22,33,62,.35);border-color:var(--accent)}
.ring{animation:fill 1.3s ease-out both}.bar span{transform-origin:left;animation:grow 1.1s ease-out both}
main>*,.grid>*{animation:rise .55s ease both}.grid>*:nth-child(2){animation-delay:.08s}.grid>*:nth-child(3){animation-delay:.16s}.grid>*:nth-child(4){animation-delay:.24s}
.btn{transition:transform .15s,box-shadow .15s,filter .15s}.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 18px -8px rgba(0,0,0,.45);filter:brightness(1.08)}.btn:active{transform:scale(.95)}
.pulse{animation:pulse 2s infinite}
.drive{transition:background .2s,padding .2s}.drive:hover{background:var(--chip);padding-left:12px;padding-right:12px;border-radius:12px}
tr:hover td{background:var(--chip)}nav button{transition:transform .2s,background .2s,opacity .2s}nav button:hover{transform:translateX(4px)}
.chip.ok{animation:pop .4s ease both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes flow{50%{background-position:100% 50%}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes scroll{to{transform:translateX(-50%)}}
@keyframes fill{from{--p:0}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 70%,transparent)}70%,100%{box-shadow:0 0 0 14px transparent}}
.btn,nav button{position:relative;overflow:hidden;isolation:isolate}
.btn::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.5) 50%,transparent 70%);transform:translateX(-130%)}
.btn:not(:disabled):hover::after{transform:translateX(130%);transition:transform .7s ease}
.btn:disabled{cursor:not-allowed}
.btn[data-apply]:hover,.btn[data-sl]:hover{animation:wobble .5s ease}
.ripple{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:currentColor;opacity:.3;transform:scale(0);animation:ripple .6s ease-out;pointer-events:none}
nav button[aria-current="true"]{animation:navpop .4s ease}
.toggle::after{transition:left .3s cubic-bezier(.3,1.7,.5,1),width .15s,background .15s}.toggle:active::after{width:24px}.toggle:hover{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 35%,transparent)}
.role select{transition:box-shadow .2s,transform .2s}.role select:hover{transform:scale(1.03)}.role select:focus{box-shadow:0 0 0 3px var(--accent)}
@keyframes ripple{to{transform:scale(14);opacity:0}}
@keyframes wobble{25%{transform:rotate(-3deg) scale(1.05)}75%{transform:rotate(3deg) scale(1.05)}}
@keyframes navpop{from{transform:scale(.9);opacity:.5}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="logo"><i>T</i><span>Thangavelu Engineering College<small>Karapakkam, Chennai</small></span></div>
  <nav id="nav" aria-label="Sections"></nav>
  <div class="role"><label for="role">Signed in as</label>
    <select id="role"><option value="student">Student</option><option value="faculty">Faculty</option><option value="placement">Placement cell</option><option value="recruiter">Recruiter</option></select></div>
</aside>
<main id="view" tabindex="-1"></main>
</div>
<div id="toast" role="status"></div>

<script>
const S={
 role:'student',tab:'overview',
 me:{name:'Thiyagu M',roll:'312624205010',dept:'Information Technology',sem:6,email:'312624205010@thangavelu.edu.in',phone:'+91 93427 77609',skills:'JavaScript, React, Node.js, SQL',projects:'Attendance Tracker – Node.js and MongoDB\nCampus Navigator – React and Leaflet',edu:'B.E. Information Technology, CGPA 8.5',summary:'Pre-final year student who enjoys building web tools that make campus life easier.'},
 courses:[
  {code:'CS601',name:'Embedded Systems and IoT',faculty:'Dr. K. Lakshmi',credits:4,att:[22,24],marks:86},
  {code:'CS602',name:'Computer Networks',faculty:'Prof. R. Sundar',credits:4,att:[19,24],marks:79},
  {code:'CS603',name:'Full Stack Web Development',faculty:'Dr. Meera Nair',credits:4,att:[23,24],marks:90},
  {code:'CS604',name:'Distributed Computing',faculty:'Prof. A. Iqbal',credits:3,att:[16,24],marks:72},
  {code:'CS605',name:'Data Warehousing',faculty:'Dr. Meera Nair',credits:3,att:[21,24],marks:84},
  {code:'CS606',name:'Digital Marketing',faculty:'Ms. Priya Raman',credits:2,att:[20,24],marks:88}],
 roster:[{n:'Aarav Krishnan',p:true},{n:'Diya Menon',p:true},{n:'Rohan Pillai',p:false},{n:'Sneha Iyer',p:true},{n:'Karthik Raja',p:true},{n:'Fatima Noor',p:false}],
 drives:[
  {id:1,co:'Zoho Corporation',role:'Software Developer',pkg:'7.5 LPA',date:'12 Nov 2026',cgpa:7.5,applied:false,loc:'Chennai',sk:'Java, DSA'},
  {id:2,co:'Infosys',role:'Systems Engineer',pkg:'4.5 LPA',date:'20 Nov 2026',cgpa:6.5,applied:true,loc:'Chennai',sk:'Aptitude, Coding'},
  {id:3,co:'Freshworks',role:'Frontend Engineer',pkg:'12 LPA',date:'28 Nov 2026',cgpa:8.0,applied:false,loc:'Hybrid',sk:'React, JavaScript'},
  {id:4,co:'Tata Consultancy Services',role:'Digital Associate',pkg:'7 LPA',date:'05 Dec 2026',cgpa:7.0,applied:false,loc:'Chennai',sk:'TCS Digital'},
  {id:5,co:'Wipro',role:'Project Engineer',pkg:'6.5 LPA',date:'10 Dec 2026',cgpa:6.5,applied:false,loc:'Chennai',sk:'Aptitude, Java'},
  {id:6,co:'Cognizant',role:'Programmer Analyst',pkg:'6.75 LPA',date:'15 Dec 2026',cgpa:6.5,applied:false,loc:'Chennai',sk:'SQL, Coding'},
  {id:7,co:'HCLTech',role:'Graduate Engineer Trainee',pkg:'5.5 LPA',date:'18 Dec 2026',cgpa:6.0,applied:false,loc:'Chennai',sk:'Networks, C'},
  {id:8,co:'Accenture',role:'Associate Software Engineer',pkg:'6.5 LPA',date:'05 Jan 2027',cgpa:6.5,applied:false,loc:'Chennai',sk:'Cloud, Cognitive'},
  {id:9,co:'Capgemini',role:'Analyst',pkg:'4.25 LPA',date:'12 Jan 2027',cgpa:6.0,applied:false,loc:'Chennai',sk:'Aptitude, English'},
  {id:10,co:'Tech Mahindra',role:'Software Engineer',pkg:'5 LPA',date:'20 Jan 2027',cgpa:6.0,applied:false,loc:'Chennai',sk:'Networks, Python'},
  {id:11,co:'Amazon',role:'Software Development Engineer',pkg:'28 LPA',date:'02 Feb 2027',cgpa:9.0,applied:false,loc:'Hybrid',sk:'DSA, System Design'}],
 candidates:[
  {n:'Aarav Krishnan',d:'CSE',c:8.4,s:'React, Node.js',st:'New'},{n:'Diya Menon',d:'IT',c:9.1,s:'Java, Spring',st:'New'},
  {n:'Rohan Pillai',d:'ECE',c:7.2,s:'Embedded C, IoT',st:'New'},{n:'Sneha Iyer',d:'CSE',c:8.8,s:'Python, ML',st:'New'}]
};
const NAV={
 student:[['overview','Overview'],['attendance','Attendance'],['grades','Grades'],['courses','Courses'],['placements','Placements'],['resume','Resume builder']],
 faculty:[['overview','Overview'],['mark','Mark attendance'],['enter','Enter grades'],['courses','Courses']],
 placement:[['overview','Overview'],['placements','Placement drives'],['courses','Courses']],
 recruiter:[['candidates','Candidates'],['placements','Open drives']]
};
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=c=>Math.round(c.att[0]/c.att[1]*100);
const grade=m=>m>=90?'O':m>=80?'A+':m>=70?'A':m>=60?'B':'C';
const gp=m=>m>=90?10:m>=80?9:m>=70?8:m>=60?7:6;
const cgpa=()=>{const t=S.courses.reduce((a,c)=>a+c.credits,0);return (S.courses.reduce((a,c)=>a+gp(c.marks)*c.credits,0)/t).toFixed(2)};
const avgAtt=()=>Math.round(S.courses.reduce((a,c)=>a+pct(c),0)/S.courses.length);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2200)}
const ring=(p,l,v,c)=>`<div class="card stat"><div class="ring" style="--p:${p};${c?'--c:'+c:''}"><b>${p}%</b></div><div><small>${l}</small><strong>${v}</strong></div></div>`;
const big=(l,v,s)=>`<div class="card"><small style="color:var(--muted)">${l}</small><div style="font:700 34px var(--display)">${v}</div><small style="color:var(--muted)">${s}</small></div>`;
const head=(t,p)=>`<div class="top"><div><h1>${t}</h1><p>${p}</p></div></div>`;

function attTable(){return `<div class="table-wrap"><table><tr><th>Course</th><th>Classes attended</th><th>Attendance</th><th>Status</th></tr>${S.courses.map(c=>{const p=pct(c);return `<tr><td>${c.code} · ${esc(c.name)}</td><td>${c.att[0]} of ${c.att[1]}</td><td><div class="bar ${p<75?'low':''}"><span style="width:${p}%"></span></div></td><td><span class="chip ${p<75?'bad':'ok'}">${p}%${p<75?' · shortage':''}</span></td></tr>`}).join('')}</table></div>`}
function gradeTable(ed){return `<div class="table-wrap"><table><tr><th>Course</th><th>Credits</th><th>Marks (100)</th><th>Grade</th></tr>${S.courses.map((c,i)=>`<tr><td>${c.code} · ${esc(c.name)}</td><td>${c.credits}</td><td>${ed?`<input type="number" min="0" max="100" value="${c.marks}" data-m="${i}" style="width:80px;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--bg)">`:c.marks}</td><td><span class="chip">${grade(c.marks)}</span></td></tr>`).join('')}</table></div>`}
function driveList(mode){return S.drives.map(d=>{
 const ok=+cgpa()>=d.cgpa;
 let act='';
 if(mode==='student')act=d.applied?'<span class="chip ok">Applied</span>':ok?`<button class="btn" data-apply="${d.id}">Apply</button>`:'<span class="chip bad">CGPA below cut-off</span>';
 if(mode==='placement')act=`<span class="chip">${d.applied?12:11} applicants</span>`;
 return `<div class="drive"><div><h4>${esc(d.co)}</h4><p>${esc(d.role)} · ${d.pkg} · Min. CGPA ${d.cgpa}</p><span class="chip">${d.date}</span> <span class="chip">${d.loc||'Chennai'}</span> ${d.sk?`<span class="chip">${esc(d.sk)}</span>`:''}</div><div>${act}</div></div>`}).join('')}

const TODAY={};
function hero(){return `<section class="hero"><div class="orb"></div><h2>Thangavelu Engineering College</h2><p>Karapakkam, Chennai · Academic and placement portal. Mark today’s attendance, check your grades and apply to campus drives.</p><button class="btn" data-tab="attendance">Mark today’s attendance</button></section>`}
function ticker(){const t=S.drives.map(d=>`<span>${esc(d.co)}</span>`).join('');return `<div class="ticker"><div class="track">${t}${t}</div></div>`}
const V={
 overview(){
  if(S.role==='faculty')return head('Good morning, Dr. Meera','Two classes today · 6 students on your roster')+`<div class="grid g4">${big('Courses taught',2,'Full Stack Web Development, Data Warehousing')}${big('Class attendance',avgAtt()+'%','Average this month')}${big('Grades pending',1,'Mid-term, CS604')}</div>`;
  if(S.role==='placement')return head('Placement cell','Season 2026–27 is live')+`<div class="grid g4">${big('Active drives',S.drives.length,'Next: Zoho, 12 Nov')}${big('Students registered',184,'of 212 eligible')}${big('Offers so far',37,'Highest 14 LPA')}</div><div class="card" style="margin-top:16px"><h3>Upcoming drives</h3>${driveList('placement')}</div>`;
  return hero()+head('Welcome back, '+S.me.name.split(' ')[0],`${S.me.dept} · Semester ${S.me.sem} · Roll ${S.me.roll}`)+`<div class="grid g4">${ring(avgAtt(),'Attendance',avgAtt()>=75?'On track':'Needs attention',avgAtt()<75?'var(--bad)':'')}${big('CGPA',cgpa(),'Computed from credits')}${big('Applications',S.drives.filter(d=>d.applied).length,'placement drives')}</div><div class="grid g2" style="margin-top:16px"><div class="card"><h3>Attendance by course</h3>${attTable()}</div><div class="card"><h3>Open drives</h3>${driveList('student')}</div></div>`},
 attendance(){const n=S.courses.filter((c,i)=>TODAY[i]).length;return head('Attendance','Minimum 75% required to sit semester exams')+`<div class="card" style="margin-bottom:16px"><div class="row" style="justify-content:space-between"><h3>Today · ${new Date().toDateString()}</h3><button class="btn ${n===S.courses.length?'':'pulse'}" id="markAll" ${n===S.courses.length?'disabled':''}>Mark present in all classes</button></div>${S.courses.map((c,i)=>`<div class="drive"><div><h4>${esc(c.name)}</h4><p>${c.code} · ${esc(c.faculty)}</p></div><div>${TODAY[i]?'<span class="chip ok">Present today</span>':`<button class="btn" data-pres="${i}">Mark present</button>`}</div></div>`).join('')}</div><div class="card">${attTable()}</div>`},
 grades(){return head('Grades','Semester '+S.me.sem+' results')+`<div class="grid g4" style="margin-bottom:16px">${big('CGPA',cgpa(),'Credit-weighted')}</div><div class="card">${gradeTable(false)}</div>`},
 enter(){return head('Enter grades','Changes update student results instantly')+`<div class="card">${gradeTable(true)}</div>`},
 mark(){return head('Mark attendance','CS603 · Full Stack Web Development · today')+`<div class="card"><div class="table-wrap"><table><tr><th>Student</th><th>Present</th></tr>${S.roster.map((r,i)=>`<tr><td>${esc(r.n)}</td><td><button class="toggle" aria-pressed="${r.p}" aria-label="Present: ${esc(r.n)}" data-t="${i}"></button></td></tr>`).join('')}</table></div><div class="row" style="margin-top:14px"><button class="btn" id="saveAtt">Save attendance</button><span class="chip" id="cnt">${S.roster.filter(r=>r.p).length} of ${S.roster.length} present</span></div></div>`},
 courses(){
  const add=S.role==='faculty'||S.role==='placement'?`<div class="card" style="margin-top:16px"><h3>Add a course</h3><div class="row"><input id="nc" placeholder="Course name" aria-label="Course name" style="flex:2;min-width:180px;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--bg)"><input id="ncr" type="number" min="1" max="6" value="3" aria-label="Credits" style="width:80px;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--bg)"><button class="btn" id="addC">Add course</button></div></div>`:'';
  return head('Courses','Semester '+S.me.sem+' · '+S.courses.reduce((a,c)=>a+c.credits,0)+' credits')+`<div class="card"><div class="table-wrap"><table><tr><th>Code</th><th>Course</th><th>Faculty</th><th>Credits</th></tr>${S.courses.map(c=>`<tr><td>${c.code}</td><td>${esc(c.name)}</td><td>${esc(c.faculty)}</td><td>${c.credits}</td></tr>`).join('')}</table></div></div>`+add},
 placements(){
  const mode=S.role==='student'?'student':S.role==='placement'?'placement':'none';
  const form=S.role==='placement'||S.role==='recruiter'?`<div class="card" style="margin-top:16px"><h3>${S.role==='recruiter'?'Post a new opening':'Schedule a drive'}</h3><div class="grid g2" style="gap:0 16px"><div class="field"><label for="dc">Company</label><input id="dc"></div><div class="field"><label for="dr">Role</label><input id="dr"></div><div class="field"><label for="dp">Package (LPA)</label><input id="dp" type="number" min="1"></div><div class="field"><label for="dg">Minimum CGPA</label><input id="dg" type="number" step=".1" min="5" max="10" value="7"></div></div><button class="btn" id="addD">Publish drive</button></div>`:'';
  return ticker()+head(S.role==='student'?'Placements':'Placement drives','Eligibility is checked against your CGPA of '+cgpa())+`<div class="card">${driveList(mode)}</div>`+form},
 resume(){const m=S.me;return head('Resume builder','Edit on the left, preview updates live')+`<div class="grid g2"><div class="card">${[['name','Full name'],['email','Email'],['phone','Phone'],['edu','Education'],['skills','Skills (comma separated)']].map(([k,l])=>`<div class="field"><label for="r_${k}">${l}</label><input id="r_${k}" data-r="${k}" value="${esc(m[k])}"></div>`).join('')}<div class="field"><label for="r_summary">Summary</label><textarea id="r_summary" data-r="summary" rows="3">${esc(m.summary)}</textarea></div><div class="field"><label for="r_projects">Projects (one per line)</label><textarea id="r_projects" data-r="projects" rows="3">${esc(m.projects)}</textarea></div><div class="row"><button class="btn" id="print">Print / save as PDF</button></div></div><div class="resume" id="rp"></div></div>`},
 candidates(){return head('Candidate pool','Verified profiles from the college placement cell')+`<div class="card"><div class="table-wrap"><table><tr><th>Name</th><th>Dept</th><th>CGPA</th><th>Skills</th><th>Decision</th></tr>${S.candidates.map((c,i)=>`<tr><td>${esc(c.n)}</td><td>${c.d}</td><td>${c.c}</td><td>${esc(c.s)}</td><td>${c.st==='New'?`<button class="btn" data-sl="${i}">Shortlist</button> <button class="btn alt" data-rj="${i}">Pass</button>`:`<span class="chip ${c.st==='Shortlisted'?'ok':'bad'}">${c.st}</span>`}</td></tr>`).join('')}</table></div></div>`}
};

function paintResume(){const m=S.me,el=$('#rp');if(!el)return;
 el.innerHTML=`<h2>${esc(m.name)}</h2><p class="sub">${esc(m.email)} · ${esc(m.phone)}</p><h4>Summary</h4><p style="margin:4px 0">${esc(m.summary)}</p><h4>Education</h4><p style="margin:4px 0">${esc(m.edu)}</p><h4>Skills</h4><p style="margin:4px 0">${m.skills.split(',').filter(s=>s.trim()).map(s=>`<span class="chip" style="background:#EDEAE0;color:#16213E;margin:2px 4px 2px 0">${esc(s.trim())}</span>`).join('')}</p><h4>Projects</h4><ul style="margin:4px 0;padding-left:18px">${m.projects.split('\n').filter(Boolean).map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`}

function render(){
 const tabs=NAV[S.role];if(!tabs.some(t=>t[0]===S.tab))S.tab=tabs[0][0];
 $('#nav').innerHTML=tabs.map(([k,l])=>`<button data-tab="${k}" ${k===S.tab?'aria-current="true"':''}>${l}</button>`).join('');
 $('#view').innerHTML=V[S.tab]();paintResume();
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.tab){S.tab=d.tab;render();window.scrollTo(0,0);return}
 if(d.apply){const x=S.drives.find(v=>v.id==d.apply);x.applied=true;toast('Applied to '+x.co);render()}
 if(d.t!==undefined){const r=S.roster[d.t];r.p=!r.p;b.setAttribute('aria-pressed',r.p);$('#cnt').textContent=S.roster.filter(r=>r.p).length+' of '+S.roster.length+' present'}
 if(d.pres!==undefined){const c=S.courses[d.pres];if(!TODAY[d.pres]){TODAY[d.pres]=1;c.att[0]++;c.att[1]++;toast('Marked present · '+c.name);render()}}
 if(b.id==='markAll'){S.courses.forEach((c,i)=>{if(!TODAY[i]){TODAY[i]=1;c.att[0]++;c.att[1]++}});toast('Marked present in all classes today');render()}
 if(b.id==='saveAtt')toast('Attendance saved');
 if(b.id==='addC'){const n=$('#nc').value.trim();if(!n){toast('Enter a course name first');return}S.courses.push({code:'CS6'+String(S.courses.length+5).padStart(2,'0'),name:n,faculty:'To be assigned',credits:+$('#ncr').value||3,att:[0,0].map(()=>1),marks:75});toast('Course added');render()}
 if(b.id==='addD'){const co=$('#dc').value.trim(),ro=$('#dr').value.trim();if(!co||!ro){toast('Add a company and a role');return}S.drives.unshift({id:Date.now(),co,role:ro,pkg:($('#dp').value||'—')+' LPA',date:'To be announced',cgpa:+$('#dg').value||7,applied:false});toast('Drive published');render()}
 if(d.sl!==undefined){S.candidates[d.sl].st='Shortlisted';toast('Candidate shortlisted');render()}
 if(d.rj!==undefined){S.candidates[d.rj].st='Passed';render()}
 if(b.id==='print')window.print();
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset.r){S.me[t.dataset.r]=t.value;paintResume()}
 if(t.dataset.m!==undefined){S.courses[t.dataset.m].marks=Math.max(0,Math.min(100,+t.value||0));t.closest('tr').querySelector('.chip').textContent=grade(S.courses[t.dataset.m].marks)}
});
document.addEventListener('pointerdown',e=>{const b=e.target.closest('.btn,nav button');if(!b||b.disabled)return;const r=b.getBoundingClientRect(),s=document.createElement('span');s.className='ripple';s.style.left=(e.clientX-r.left)+'px';s.style.top=(e.clientY-r.top)+'px';b.appendChild(s);setTimeout(()=>s.remove(),650)});
$('#role').addEventListener('change',e=>{S.role=e.target.value;S.tab=NAV[S.role][0][0];render()});
render();
</script>
</body>
</html>
